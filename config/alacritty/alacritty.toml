[general]
import = ["./colors.toml"]
live_config_reload = true
working_directory = "None"


[window]
dynamic_padding = true
decorations = "none"
opacity = 0.7
padding.x = 10
padding.y = 10

[cursor]
style.shape = "beam"
unfocused_hollow = true

[mouse]
hide_when_typing = true

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 6

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"
